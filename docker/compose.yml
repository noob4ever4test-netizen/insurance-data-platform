name: azki-pipeline

x-kafka-environment: &kafka-environment
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m

x-kafka-health: &kafka-health
  test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 20
  start_period: 30s

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck: *kafka-health

  kafka-2:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka-2
    profiles: [three-brokers]
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://127.0.0.1:9094
    ports: ["127.0.0.1:9094:9092"]
    volumes: ["kafka_2_data:/var/lib/kafka/data"]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck: *kafka-health

  kafka-3:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka-3
    profiles: [three-brokers]
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://127.0.0.1:9096
    ports: ["127.0.0.1:9096:9092"]
    volumes: ["kafka_3_data:/var/lib/kafka/data"]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck: *kafka-health

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.2
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      kafka: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  connect:
    image: azki/kafka-connect:7.9.2-debezium2.7.4-spooldir2.0.65
    build: {context: ./connect}
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: azki-connect
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/opt/connect-plugins
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports: ["127.0.0.1:8083:8083"]
    volumes:
      - spool_data:/spool
      - ./secrets/mysql.properties:/opt/secrets/mysql.properties:ro
    depends_on:
      kafka: {condition: service_healthy}
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8083/connector-plugins >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: azki-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: azki-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      JAVA_OPTS: -Xms128m -Xmx256m
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      kafka: {condition: service_healthy}
      connect: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0.43
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --local-infile=ON
      - --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: azki
      MYSQL_USER: debezium
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_cdc_password
    secrets: [mysql_root_password, mysql_cdc_password]
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/mysql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../sql/mysql/010_load.sql:/docker-entrypoint-initdb.d/010_load.sql:ro
      - ./mysql/conf.d/client.cnf:/etc/mysql/conf.d/client.cnf:ro
      - ../tests/fixtures/users.csv:/seed/users.csv:ro
      - ./generated:/seed/generated:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysqladmin ping -h127.0.0.1 -uroot --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20

secrets:
  mysql_root_password: {file: ./secrets/mysql_root_password.txt}
  mysql_cdc_password: {file: ./secrets/mysql_cdc_password.txt}

volumes:
  kafka_data:
  kafka_2_data:
  kafka_3_data:
  mysql_data:
  clickhouse_data:
  spool_data:
